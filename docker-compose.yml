services:
  # ============================================
  # MinIO Object Storage
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: minio_iris_project
    env_file:
      - ./.env
    ports:
      - "${MINIO__S3_API_PORT:-9000}:9000"
      - "${MINIO__Web_UI_PORT:-9001}:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO__ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO__SECRET_KEY:-minioadmin123}
      MINIO_DOMAIN: ${MINIO__DOMAIN:-localhost}

    command: server /data --console-address ":${MINIO__Web_UI_PORT:-9001}"
    volumes:
      - ./.minio_data:/data
    networks:
      - iris_network
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://${MINIO__DOMAIN:-localhost}:${MINIO__S3_API_PORT:-9000}/minio/health/live",
        ]
      interval: 30s
      timeout: 20s
      retries: 3
networks:
  iris_network:
    driver: bridge
